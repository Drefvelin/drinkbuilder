# Relative to the server root (plugins/..).
paths:
  breweryx-folder: "plugins/BreweryX"
  itemsadder-tfmc-drinks: "plugins/ItemsAdder/contents/tfmc_drinks"

# Reserved custom model data range for tfmc_drinks potions.
cmd:
  min: 20000
  max: 29999

# Seconds to wait after /iareload before /iazip (texture drinks).
ia-reload-delay-seconds: 8

# Passive apply from ProvinceSystem (approved / pending_pack, not yet applied).
pack-apply:
  # Poll every N seconds; 0 = disable periodic pull (empty-server pull still runs).
  poll-interval-seconds: 120
  # Daily force pull + IA refresh at local HH:mm; empty = disable.
  force-reload-time: "06:00"

# Rank entitlements (name colour stops + texture) live in permission-groups.yml.
